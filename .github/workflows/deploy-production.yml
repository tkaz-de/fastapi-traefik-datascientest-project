name: Deploy Production

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DEPLOY_TARGET: kubernetes
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/fastapi-traefik-datascientest-project-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/fastapi-traefik-datascientest-project-frontend
  K8S_ENV: prod

jobs:
  build-and-push:
    runs-on: self-hosted
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            TAG="${GITHUB_REF_NAME#v}"
          else
            TAG="${GITHUB_SHA::7}"
          fi
          echo "image_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build backend image
        run: docker build -t $BACKEND_IMAGE:${{ steps.meta.outputs.image_tag }} ./backend

      - name: Build frontend image
        run: docker build -t $FRONTEND_IMAGE:${{ steps.meta.outputs.image_tag }} ./frontend

      - name: Push backend image
        run: docker push $BACKEND_IMAGE:${{ steps.meta.outputs.image_tag }}

      - name: Push frontend image
        run: docker push $FRONTEND_IMAGE:${{ steps.meta.outputs.image_tag }}

  approval-gate:
    name: Production Approval Gate
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production
    steps:
      - name: Await manual approval
        run: echo "Deployment to production approved via GitHub Environment reviewers."

  deploy-prod:
    runs-on: self-hosted
    needs:
      - build-and-push
      - approval-gate
    environment:
      name: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG_PROD }}
        run: |
          if [ -n "$KUBECONFIG_CONTENT" ]; then
            mkdir -p $HOME/.kube
            printf '%s' "$KUBECONFIG_CONTENT" > $HOME/.kube/config-ci
            chmod 600 $HOME/.kube/config-ci
            echo "KUBECONFIG=$HOME/.kube/config-ci" >> $GITHUB_ENV
          else
            echo "Using the self-hosted runner default kubeconfig."
          fi

      - name: Configure GHCR pull secret
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kubectl apply -f k8s/prod/prod-namespace.yaml
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="$GHCR_TOKEN" \
            -n ${K8S_ENV} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply prod manifests
        run: kubectl apply -f k8s/${K8S_ENV}

      - name: Load images into local Minikube
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          if command -v minikube >/dev/null 2>&1; then
            minikube image load "$BACKEND_IMAGE:${{ needs.build-and-push.outputs.image_tag }}"
            minikube image load "$FRONTEND_IMAGE:${{ needs.build-and-push.outputs.image_tag }}"
          else
            echo "Minikube not present on runner; relying on GHCR image pull secret."
          fi

      - name: Update backend image in deployment
        run: |
          kubectl set image deployment/backend \
            backend=$BACKEND_IMAGE:${{ needs.build-and-push.outputs.image_tag }} \
            -n ${K8S_ENV}
          kubectl patch deployment backend -n ${K8S_ENV} \
            -p '{"spec":{"template":{"spec":{"containers":[{"name":"backend","imagePullPolicy":"IfNotPresent"}]}}}}'

      - name: Update frontend image in deployment
        run: |
          kubectl set image deployment/frontend \
            frontend=$FRONTEND_IMAGE:${{ needs.build-and-push.outputs.image_tag }} \
            -n ${K8S_ENV}
          kubectl patch deployment frontend -n ${K8S_ENV} \
            -p '{"spec":{"template":{"spec":{"containers":[{"name":"frontend","imagePullPolicy":"IfNotPresent"}]}}}}'

      - name: Wait for backend rollout
        run: kubectl rollout status deployment/backend -n ${K8S_ENV} --timeout=300s

      - name: Wait for frontend rollout
        run: kubectl rollout status deployment/frontend -n ${K8S_ENV} --timeout=300s
