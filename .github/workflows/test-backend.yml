name: Test Backend

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - "scripts/ci-backend-checks.sh"
      - ".github/workflows/test-backend.yml"
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - "scripts/ci-backend-checks.sh"
      - ".github/workflows/test-backend.yml"

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run backend checks in Compose
        run: bash scripts/ci-backend-checks.sh "Coverage for ${{ github.sha }}"
        env:
          CI_COMPOSE_PROJECT_NAME: test-backend-${{ github.run_id }}
      - name: Store coverage files
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: backend/htmlcov
          include-hidden-files: true
