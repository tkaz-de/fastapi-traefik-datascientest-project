<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Architecture Overview</title>
  <desc id="desc">Application, CI/CD, infrastructure, Kubernetes environments, monitoring, security, and disaster recovery for the maintained project path.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel-title { font: 700 28px 'Arial', sans-serif; fill: #0f172a; }
      .section-title { font: 700 19px 'Arial', sans-serif; fill: #111827; }
      .label { font: 600 15px 'Arial', sans-serif; fill: #111827; }
      .text { font: 13px 'Arial', sans-serif; fill: #334155; }
      .small { font: 12px 'Arial', sans-serif; fill: #475569; }
      .box { rx: 14; ry: 14; stroke-width: 2; }
      .arrow { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 7 7; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="980" />
  <text x="44" y="52" class="panel-title">Architecture Overview: Maintained Delivery Path</text>

  <rect x="36" y="84" width="1528" height="220" class="box" fill="#eef2ff" stroke="#4f46e5" />
  <text x="60" y="118" class="section-title">Source Control and CI/CD</text>

  <rect x="70" y="148" width="230" height="92" class="box" fill="#e0e7ff" stroke="#4338ca" />
  <text x="90" y="182" class="label">GitHub Repository</text>
  <text x="90" y="205" class="text">Branches: dev, main</text>
  <text x="90" y="226" class="text">Docs, app code, manifests</text>

  <rect x="350" y="148" width="310" height="92" class="box" fill="#ddd6fe" stroke="#7c3aed" />
  <text x="370" y="182" class="label">GitHub Actions</text>
  <text x="370" y="205" class="text">Lint, tests, security scans</text>
  <text x="370" y="226" class="text">Backend CI, Compose test, deploy workflows</text>

  <rect x="710" y="148" width="220" height="92" class="box" fill="#ede9fe" stroke="#6d28d9" />
  <text x="730" y="182" class="label">GHCR</text>
  <text x="730" y="205" class="text">backend image</text>
  <text x="730" y="226" class="text">frontend image</text>

  <rect x="980" y="148" width="250" height="92" class="box" fill="#dcfce7" stroke="#15803d" />
  <text x="1000" y="182" class="label">Deploy Dev</text>
  <text x="1000" y="205" class="text">Automatic from dev</text>
  <text x="1000" y="226" class="text">Updates namespace: dev</text>

  <rect x="1280" y="148" width="250" height="92" class="box" fill="#dbeafe" stroke="#2563eb" />
  <text x="1300" y="182" class="label">Deploy Production</text>
  <text x="1300" y="205" class="text">Manual approval gate</text>
  <text x="1300" y="226" class="text">Updates namespace: prod</text>

  <path class="arrow" d="M300 194 L350 194" />
  <path class="arrow" d="M660 194 L710 194" />
  <path class="arrow" d="M930 194 L980 194" />
  <path class="arrow" d="M930 214 L1280 214" />

  <rect x="36" y="336" width="1000" height="434" class="box" fill="#ecfeff" stroke="#0891b2" />
  <text x="60" y="370" class="section-title">Single VM Runtime</text>
  <text x="60" y="392" class="text">Minikube cluster on one VM, namespace-separated environments</text>

  <rect x="70" y="428" width="280" height="122" class="box" fill="#e2e8f0" stroke="#64748b" />
  <text x="92" y="462" class="label">Ingress Layer</text>
  <text x="92" y="486" class="text">Repository manifests: Traefik-oriented</text>
  <text x="92" y="507" class="text">Local Minikube verification: NGINX ingress</text>
  <text x="92" y="528" class="small">Frontend and backend health checks via ingress</text>

  <rect x="392" y="428" width="288" height="282" class="box" fill="#ccfbf1" stroke="#0f766e" />
  <text x="416" y="462" class="label">Namespace: dev</text>
  <text x="416" y="486" class="text">Frontend deployment</text>
  <text x="416" y="507" class="text">Backend deployment</text>
  <text x="416" y="528" class="text">PostgreSQL + PVC</text>
  <text x="416" y="549" class="text">Backup PVC + CronJob</text>
  <text x="416" y="570" class="small">Automatic target for branch dev</text>

  <rect x="718" y="428" width="282" height="282" class="box" fill="#cffafe" stroke="#0e7490" />
  <text x="742" y="462" class="label">Namespace: prod</text>
  <text x="742" y="486" class="text">Frontend deployment</text>
  <text x="742" y="507" class="text">Backend deployment</text>
  <text x="742" y="528" class="text">PostgreSQL + PVC</text>
  <text x="742" y="549" class="text">Backup PVC + CronJob</text>
  <text x="742" y="570" class="text">RBAC + TLS ingress</text>
  <text x="742" y="591" class="small">Manual approval before deployment</text>

  <path class="arrow" d="M210 550 L392 550" />
  <path class="arrow" d="M210 580 L718 580" />

  <rect x="1070" y="336" width="494" height="434" class="box" fill="#f8fafc" stroke="#475569" />
  <text x="1094" y="370" class="section-title">Observability, Security, and Recovery</text>

  <rect x="1104" y="424" width="424" height="110" class="box" fill="#d9f99d" stroke="#65a30d" />
  <text x="1126" y="458" class="label">Monitoring Stack</text>
  <text x="1126" y="482" class="text">Prometheus, Grafana, Alertmanager, Blackbox Exporter</text>
  <text x="1126" y="503" class="text">Backend metrics, target health, dashboards, alerts</text>

  <rect x="1104" y="560" width="424" height="86" class="box" fill="#fee2e2" stroke="#dc2626" />
  <text x="1126" y="594" class="label">Security Controls</text>
  <text x="1126" y="618" class="text">CodeQL, Trivy, Dependabot, Kubernetes Secrets, TLS, RBAC</text>

  <rect x="1104" y="668" width="424" height="86" class="box" fill="#fde68a" stroke="#d97706" />
  <text x="1126" y="702" class="label">Disaster Recovery</text>
  <text x="1126" y="726" class="text">Daily DB backups, restore path, PVC persistence, rollback runbooks</text>

  <path class="arrow" d="M1000 520 L1104 470" />
  <path class="arrow" d="M1000 590 L1104 603" />
  <path class="arrow" d="M1000 650 L1104 711" />

  <rect x="36" y="804" width="1528" height="136" class="box" fill="#fff7ed" stroke="#c2410c" />
  <text x="60" y="838" class="section-title">Infrastructure Layer</text>

  <rect x="88" y="856" width="300" height="56" class="box" fill="#ffedd5" stroke="#ea580c" />
  <text x="110" y="890" class="label">Terraform</text>
  <text x="220" y="890" class="text">VM provisioning definitions</text>

  <rect x="446" y="856" width="300" height="56" class="box" fill="#ffedd5" stroke="#ea580c" />
  <text x="468" y="890" class="label">Ansible</text>
  <text x="560" y="890" class="text">VM bootstrap and cluster preparation</text>

  <rect x="804" y="856" width="340" height="56" class="box" fill="#ffedd5" stroke="#ea580c" />
  <text x="826" y="890" class="label">Kubernetes Manifests</text>
  <text x="1008" y="890" class="text">dev, prod, monitoring</text>

  <rect x="1202" y="856" width="310" height="56" class="box" fill="#ffedd5" stroke="#ea580c" />
  <text x="1224" y="890" class="label">Project Documentation</text>
  <text x="1384" y="890" class="text">README, SECURITY, DR, deployment</text>

  <path class="arrow dashed" d="M596 856 L596 770" />
  <path class="arrow dashed" d="M974 856 L974 770" />
  <path class="arrow dashed" d="M1320 856 L1320 770" />
</svg>
