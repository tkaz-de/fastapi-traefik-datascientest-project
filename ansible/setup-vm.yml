# COMMAND TO RUN:
# ansible-playbook -i inventory.ini setup-vm.yml -K

- name: "Configure the new test VM"
  hosts: fastapivm_test
  become: yes
  vars:
    # Prevent warnings related to the Python version
    ansible_python_interpreter: /usr/bin/python3.12

  tasks:
    - name: "Run system update"
      apt:
        update_cache: yes
        upgrade: dist
        cache_valid_time: 3600

    - name: "Install Docker and tools"
      apt:
        name: 
          - docker.io
          - curl
          - git
          - socat
          - conntrack
        state: present

    - name: "Add user to the Docker group"
      user:
        name: ipatsaf
        groups: docker
        append: yes

    - name: "Download Minikube"
      get_url:
        url: https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
        dest: /usr/local/bin/minikube
        mode: '0755'

    - name: "Download kubectl"
      get_url:
        url: "https://dl.k8s.io/release/v1.28.0/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: '0755'

    - name: "Check whether Minikube is already running"
      become: yes
      become_user: ipatsaf
      command: minikube status
      register: minikube_status
      ignore_errors: yes
      changed_when: false

    - name: "Delete the old Minikube profile if needed"
      become: yes
      become_user: ipatsaf
      command: minikube delete
      # Delete the profile when Minikube is not running to enforce the new config
      when: "'Running' not in minikube_status.stdout"
      ignore_errors: yes

    - name: "Start Minikube"
      become: yes
      become_user: ipatsaf
      # Use 2048 MB (2 GB), the most stable value for 4 GB VMs
      command: minikube start --driver=docker --memory=2048 --cpus=2
      register: minikube_start_result
      # Start only when it is not already running
      when: "'Running' not in minikube_status.stdout"
