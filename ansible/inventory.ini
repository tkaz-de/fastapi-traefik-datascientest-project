[fastapivm_test]
# Internal IP of the test VM.
# From this VM, the host is directly reachable on the 10.10.10.0/24 network.
10.10.10.51 ansible_user=ipatsaf ansible_ssh_private_key_file=~/.ssh/id_ed25519_github_vm

[fastapivm_test:vars]
