apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-prod
  namespace: prod
  labels:
    app.kubernetes.io/name: fastapi-traefik-datascientest-project
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/environment: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fastapi-traefik-datascientest-project
      app.kubernetes.io/component: database
      app.kubernetes.io/environment: prod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fastapi-traefik-datascientest-project
        app.kubernetes.io/component: database
        app.kubernetes.io/environment: prod
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "app"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: db-prod-data
---
apiVersion: v1
kind: Service
metadata:
  name: db-prod
  namespace: prod
  labels:
    app.kubernetes.io/name: fastapi-traefik-datascientest-project
    app.kubernetes.io/component: database
    app.kubernetes.io/environment: prod
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app.kubernetes.io/name: fastapi-traefik-datascientest-project
    app.kubernetes.io/component: database
    app.kubernetes.io/environment: prod
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-prod-data
  namespace: prod
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-prod-backups
  namespace: prod
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-prod-backup
  namespace: prod
spec:
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pgdump
              image: postgres:15
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: backend-secret
                      key: POSTGRES_PASSWORD
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  mkdir -p /backup
                  pg_dump --format=custom --no-owner --no-privileges \
                    --host=db-prod --username=postgres --dbname=app \
                    | gzip > "/backup/app_$(date +%F_%H%M).dump.gz"
                  find /backup -type f -name '*.dump.gz' -mtime +14 -delete
              volumeMounts:
                - name: backup-volume
                  mountPath: /backup
          volumes:
            - name: backup-volume
              persistentVolumeClaim:
                claimName: db-prod-backups
